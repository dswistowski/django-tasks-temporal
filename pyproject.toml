[project]
name = "django-tasks-temporal"
version = "0.1.0"
description = "A Temporal workflow task queue backend for Django 6.0's built-in task framework"
readme = "README.md"
license = "MIT"
license-files = [ "LICENSE" ]
authors = [
    { name = "Damian Świstowski", email = "damian@swistowski.org" }
]
maintainers = [
    { name = "Damian Świstowski", email = "damian@swistowski.org" }
]
keywords = [
    "django",
    "tasks",
    "temporal",
    "async",
    "queue",
    "background",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.12"

dependencies = [
    "django>=6.0",
    "temporalio>=1.25.0",
]

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[project.urls]
Homepage = "https://github.com/dswistowski/django-tasks-temporal"
Repository = "https://github.com/dswistowski/django-tasks-temporal"
Issues = "https://github.com/dswistowski/django-tasks-temporal/issues"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["django_tasks_temporal"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "django_app.settings"
pythonpath = [".", "tests"]
addopts = "-v"

[dependency-groups]
dev = [
    "mypy>=1.20.0",
    "pytest>=9.0.3",
    "pytest-django>=4.12.0",
    "ruff>=0.15.10",
]
